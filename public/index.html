<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; overflow: hidden; }
        .calc-container { background: #1e293b; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 320px; transition: all 0.5s ease; }
        .display { width: 100%; height: 70px; background: #0f172a; border: none; border-radius: 10px; margin-bottom: 20px; padding: 15px; text-align: right; font-size: 2rem; color: #38bdf8; outline: none; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 18px; font-size: 1.25rem; border: none; border-radius: 12px; cursor: pointer; background: #334155; color: #fff; transition: background 0.2s; user-select: none; }
        button:hover { background: #475569; }
        button.operator { background: #0284c7; color: #fff; }
        button.operator:hover { background: #0369a1; }
        button.clear { background: #ef4444; }
        button.clear:hover { background: #dc2626; }
        
        .proxy-container { display: none; width: 100%; height: 100vh; background: #0f172a; animation: fadeIn 0.5s ease; position: absolute; top:0; left:0; z-index: 9999; }
        .proxy-bar { background: #1e293b; padding: 10px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #334155; }
        .proxy-bar input { flex: 1; padding: 10px 20px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        .proxy-bar button { padding: 10px 20px; border-radius: 20px; background: #38bdf8; color: #0f172a; font-weight: bold; border:none; cursor: pointer; }
        .proxy-bar button:hover { background: #0ea5e9; }
        iframe { width: 100%; height: calc(100vh - 60px); border: none; background: #fff; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <!-- Подключаем локальные скрипты Ultraviolet -->
    <script src="/uv.config.js" defer></script>
    <script src="/uv.bundle.js" defer></script>
</head>
<body>

    <div class="calc-container" id="calc">
        <input type="text" class="display" id="screen" readonly value="0">
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button onclick="press('/')" class="operator">/</button>
            <button onclick="press('*')" class="operator">*</button>
            <button onclick="press('-')" class="operator">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('+')" class="operator" style="grid-row: span 2; height: 100%;">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="calculate()" class="operator" style="grid-row: span 2; height: 100%; background: #22c55e;">=</button>
            
            <button onclick="press('0')" style="grid-column: span 2;">0</button>
            <button onclick="press('.')">.</button>
        </div>
    </div>

    <div class="proxy-container" id="proxyPanel">
        <div class="proxy-bar">
            <input type="text" id="urlInput" placeholder="Введи адрес (например, youtube.com) или поисковый запрос">
            <button onclick="redirectToProxy()">Перейти</button>
        </div>
        <iframe id="proxyFrame"></iframe>
    </div>

    <script>
        let currentInput = "0";

        function press(num) {
            if (currentInput === "0" && num !== ".") currentInput = "";
            currentInput += num;
            document.getElementById("screen").value = currentInput;

            if (currentInput === "2208") activateSecretMode();
        }

        function clearScreen() {
            currentInput = "0";
            document.getElementById("screen").value = currentInput;
        }

        function calculate() {
            try {
                document.getElementById("screen").value = String(eval(currentInput));
            } catch {
                document.getElementById("screen").value = "Ошибка";
                currentInput = "0";
            }
        }

        function activateSecretMode() {
            document.getElementById("calc").style.display = "none";
            document.getElementById("proxyPanel").style.display = "block";
            
            // Теперь регистрируем ЛОКАЛЬНЫЙ Service Worker, браузер это разрешит!
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/uv.sw.js', {
                    scope: '/uv/service/'
                }).then(() => console.log('Ultraviolet SW запущен локально!'))
                  .catch(err => console.error('Ошибка SW:', err));
            }
        }

        function redirectToProxy() {
            let input = document.getElementById("urlInput").value.trim();
            let url;

            if (!input.includes('.') || input.includes(' ')) {
                url = 'https://duckduckgo.com' + encodeURIComponent(input);
            } else {
                url = /^https?:\/\//i.test(input) ? input : 'https://' + input;
            }
            
            if (window.__uv$config) {
                const targetProxyUrl = window.__uv$config.prefix + window.__uv$config.encodeUrl(url);
                document.getElementById("proxyFrame").src = targetProxyUrl;
            } else {
                alert("Прокси ещё загружается скриптами, подожди секунду...");
            }
        }
    </script>
</body>
</html>
