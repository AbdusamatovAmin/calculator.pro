<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Pro</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .calc-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { width: 200px; padding: 10px; font-size: 18px; text-align: right; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #proxy-frame { display: none; width: 95%; height: 85vh; margin-top: 20px; border: 2px solid #007bff; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="calc-container" id="calc-block">
        <h2>Калькулятор</h2>
        <input type="text" id="display" placeholder="0" readonly>
        <br>
        <button class="btn" onclick="activateSecretMode('2208')">Ввести 2208</button>
    </div>

    <!-- Контейнер для отображения встроенного сайта -->
    <iframe id="proxy-frame" src=""></iframe>

    <script>
        function activateSecretMode(value) {
            const display = document.getElementById('display');
            display.value = value;

            if (value === '2208') {
                // Скрываем интерфейс калькулятора
                document.getElementById('calc-block').style.display = 'none';
                
                // Отображаем фрейм на весь экран
                const frame = document.getElementById('proxy-frame');
                frame.style.display = 'block';
                
                // В качестве демонстрации используем простой сайт.
                // ВАЖНО: Крупные поисковики вроде Google имеют защиту, которую данный простой скрипт не обойдет.
                const targetSite = 'https://example.com'; 
                
                // Автоматически подставляем домен Render или localhost
                const currentHost = window.location.origin;
                frame.src = `${currentHost}/proxy?url=${encodeURIComponent(targetSite)}`;
            }
        }
    </script>
</body>
</html>
